[project]
name = "financial-research-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.4.0",
    "ddgs>=9.14.4",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.25.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-google-community>=5.0.0",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=0.3.0",
    "numpy<2.0.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.2.2",
    "scipy<1.14.0",
    "sentence-transformers>=2.2.0",
    "streamlit>=1.61.1",
    "tabulate>=0.9.0",
    "transformers<4.44.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
financial-research-assistant = "financial_research_assistant:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
extraPaths = ["."]

