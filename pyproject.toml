[project]
name = "financial-research-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.14.4",
    "langchain>=1.3.14",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.2",
    "streamlit>=1.61.1",
]

[project.scripts]
financial-research-assistant = "financial_research_assistant:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
extraPaths = ["."]

